<!DOCTYPE html>
<!-- L-01: lang перевыставляется из getLocale() при старте (i18n.js) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Reborn v0.1</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
</head>
<body>
    <div id="app">
        <div id="gameActions" class="hud-corner hud-bottom-right">
            <button type="button" id="undoLastConstellationBtn" class="hud-icon-btn"
                    data-i18n-title="field.undoLast" data-i18n-aria="field.undoLast"
                    disabled>↩</button>
            <!-- B-02: в обсерватории ↩ прячется, на её месте тумблер режима -->
            <div id="observatoryModeSeg" class="sheet-seg obs-mode-seg" hidden>
                <button type="button" id="obsModeConnectBtn" class="seg-btn seg-btn-icon"
                        data-i18n-title="observatory.modeConnect"
                        data-i18n-aria="observatory.modeConnect">🔗</button>
                <button type="button" id="obsModeMoveBtn" class="seg-btn seg-btn-icon"
                        data-i18n-title="observatory.modeMove"
                        data-i18n-aria="observatory.modeMove">✋</button>
            </div>
        </div>

        <button type="button" id="devToggleBtn" class="dev-toggle-btn" aria-label="Служебная панель"></button>
        <div id="devControls" class="dev-controls">
            <div class="dev-zoom-row">
                <button type="button" id="zoomOutButton" title="Отдалить">−</button>
                <button type="button" id="zoomInButton" title="Приблизить">＋</button>
            </div>
            <button id="resetButton">Сбросить небо</button>
            <div class="dev-picture-row">
                <select id="devPictureFieldSelect" aria-label="Поле-картинка"></select>
                <button id="devPictureFieldShowBtn" type="button">Показать</button>
            </div>
            <button id="devAddMetaButton">+100 ✦ (как забор награды)</button>
            <button id="devNewDayButton">Новый день</button>
            <button id="devResetAchievementsButton">Сбросить достижения</button>
            <button id="fullResetButton" class="btn-danger">Полный сброс</button>
        </div>

        <div id="constellation-hints" class="hints-panel-hidden" hidden>
            <div class="level-patterns-title" data-i18n="hints.title">Patterns</div>
            <div id="hintStarFilterBar" class="hint-filter-bar"></div>
            <div id="hintList" class="hint-list"></div>
        </div>

        <div id="canvas-container"></div>

        <!-- U-09: свёрнутая шторка — торчит нижним краем, её тянут вверх или жмут -->
        <div id="peekBar" class="sheet-peek" role="button" tabindex="0"
             data-i18n-aria="sheet.open">
            <div class="sheet-grab" aria-hidden="true"></div>
            <span id="peekRewardsBadge" class="peek-badge" hidden></span>
        </div>

        <!-- U-09: шторка — Атлас и Награды, управление в подвале -->
        <div id="sheetScrim" class="sheet-scrim" hidden></div>
        <div id="sheet" class="sheet" hidden>
            <div id="sheetHandle" class="sheet-handle">
                <div class="sheet-grab" aria-hidden="true"></div>
                <div id="sheetTitle" class="sheet-title"></div>
                <div class="sheet-score" data-i18n-aria="sheet.score">
                    <span class="peek-score-icon" aria-hidden="true">✦</span>
                    <span id="sheetScoreValue">0</span>
                </div>
            </div>
            <div id="sheetContent" class="sheet-content">
                <div id="atlasList" class="atlas-grid" hidden></div>
                <div id="achievementsList" class="achv-list" hidden></div>
            </div>
            <div class="sheet-footer">
                <div id="sheetRail" class="sheet-rail"></div>
                <div class="sheet-bottom-row">
                    <!-- B-02: хинт запертой обсерватории — поповер поверх подвала.
                         Он НЕ в потоке: вёрстка шторки от него не съезжает.
                         Прогресс-бар свой, «за всё время», а не ✦ из шапки —
                         тот обнуляется автосписанием страницы атласа. -->
                    <div id="observatoryLockHint" class="obs-lock-hint" role="dialog" hidden>
                        <div class="obs-lock-title"><span aria-hidden="true">🔒</span> <span id="obsLockTitleText"></span></div>
                        <div class="obs-lock-sub" id="obsLockSubText"></div>
                        <div class="obs-lock-bar"><div id="obsLockBarFill" class="obs-lock-bar-fill"></div></div>
                        <div class="obs-lock-progress" id="obsLockProgressText"></div>
                    </div>
                    <div class="sheet-seg">
                        <button type="button" id="segAtlasBtn" class="seg-btn" data-i18n="sheet.segAtlas">Atlas</button>
                        <button type="button" id="segRewardsBtn" class="seg-btn" data-i18n="sheet.segRewards">Rewards</button>
                        <!-- B-02: разделитель — кнопка обсерватории другого рода,
                             без него невыделенные кнопки сливаются в одну полосу -->
                        <span class="seg-divider" aria-hidden="true"></span>
                        <button type="button" id="segObservatoryBtn" class="seg-btn seg-btn-icon">🔭</button>
                    </div>
                    <button type="button" id="sheetCloseBtn" class="sheet-close-btn"
                            data-i18n-title="sheet.collapse" data-i18n-aria="sheet.collapse">↓</button>
                </div>
            </div>
        </div>

        <div id="levelCompleteToast" class="level-complete-toast" hidden></div>
        <div id="achvToastStack" class="achv-toast-stack"></div>
    </div>

    <!-- L-01: i18n идёт самым первым — словари нужны уже на этапе объявления
         констант, а lang выставляется до первого кадра -->
    <script src="js/i18n.js"></script>
    <!-- T-01: харнесс идёт следом, чтобы ловить ошибки с самой загрузки;
         без ?test=1 он выходит сразу и ничего не создаёт -->
    <script src="js/testApi.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/pictureFields.js"></script>
    <script src="js/field.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/drawing.js"></script>
    <!-- B-02: обсерватория опирается на camera.js (клампы, зазоры) и field.js (maxEdge) -->
    <script src="js/observatory.js"></script>
    <script src="js/topologyRecognition.js"></script>
    <script src="js/recognition.js"></script>
    <script src="js/customTypes.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sketch.js"></script>
</body>
</html>
