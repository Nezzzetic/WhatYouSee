<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Reborn v0.1</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>
</head>
<body>
    <div id="app">
        <div id="gameActions" class="hud-corner hud-bottom-right">
            <button type="button" id="undoLastConstellationBtn" class="hud-icon-btn" title="Отменить последнее созвездие" disabled aria-label="Отменить последнее созвездие">↩</button>
        </div>

        <button type="button" id="devToggleBtn" class="dev-toggle-btn" aria-label="Служебная панель"></button>
        <div id="devControls" class="dev-controls">
            <div class="dev-zoom-row">
                <button type="button" id="zoomOutButton" title="Отдалить">−</button>
                <button type="button" id="zoomInButton" title="Приблизить">＋</button>
            </div>
            <button id="resetButton">Сбросить небо</button>
            <div class="dev-picture-row">
                <select id="devPictureFieldSelect" aria-label="Поле-картинка"></select>
                <button id="devPictureFieldShowBtn" type="button">Показать</button>
            </div>
            <button id="devNewDayButton">Новый день</button>
            <button id="devResetAchievementsButton">Сбросить достижения</button>
            <button id="fullResetButton" class="btn-danger">Полный сброс</button>
        </div>

        <div id="constellation-hints" class="hints-panel-hidden" hidden>
            <div class="level-patterns-title">Паттерны</div>
            <div id="hintStarFilterBar" class="hint-filter-bar"></div>
            <div id="hintList" class="hint-list"></div>
        </div>

        <div id="canvas-container"></div>

        <!-- U-09: peek-строка на поле — ✦ и вызов обеих половин шторки -->
        <div id="peekBar" class="peek-bar">
            <div class="peek-score" aria-label="Очки">
                <span class="peek-score-icon" aria-hidden="true">✦</span>
                <span id="scoreCounterValue">0</span>
            </div>
            <button type="button" id="peekAtlasBtn" class="peek-btn">Атлас</button>
            <button type="button" id="peekRewardsBtn" class="peek-btn">
                Награды<span id="peekRewardsBadge" class="peek-badge" hidden></span>
            </button>
        </div>

        <!-- U-09: шторка — Атлас и Награды, управление в подвале -->
        <div id="sheetScrim" class="sheet-scrim" hidden></div>
        <div id="sheet" class="sheet" hidden>
            <div id="sheetHandle" class="sheet-handle">
                <div class="sheet-grab" aria-hidden="true"></div>
                <div id="sheetTitle" class="sheet-title"></div>
                <div class="sheet-score" aria-label="Очки">
                    <span class="peek-score-icon" aria-hidden="true">✦</span>
                    <span id="sheetScoreValue">0</span>
                </div>
            </div>
            <div id="sheetContent" class="sheet-content">
                <div id="atlasList" class="atlas-grid" hidden></div>
                <div id="achievementsList" class="achv-list" hidden></div>
            </div>
            <div class="sheet-footer">
                <div id="sheetRail" class="sheet-rail"></div>
                <div class="sheet-seg">
                    <button type="button" id="segAtlasBtn" class="seg-btn">Атлас</button>
                    <button type="button" id="segRewardsBtn" class="seg-btn">Награды</button>
                </div>
            </div>
        </div>

        <div id="levelCompleteToast" class="level-complete-toast" hidden></div>
        <div id="achvToastStack" class="achv-toast-stack"></div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/pictureFields.js"></script>
    <script src="js/field.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/topologyRecognition.js"></script>
    <script src="js/recognition.js"></script>
    <script src="js/customTypes.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sketch.js"></script>
</body>
</html>
