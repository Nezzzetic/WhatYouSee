<!DOCTYPE html>
<!-- L-01: lang перевыставляется из getLocale() при старте (i18n.js) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- K-05 (правила P-02): viewport-fit=cover — без него env(safe-area-inset-*)
         в WebView всегда ноль, и лента-закладка уедет под навигационную панель.
         В обычном браузере инсеты нулевые, так что на Pages не меняется ничего. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stars Reborn v0.1</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- P-02: p5 лежит в репозитории, а не на cdnjs — упавший CDN означал «игра
         не стартует вообще», а в нативной обёртке ещё и «нет сети — нет игры».
         Версия та же, 1.7.0; обновлять — заменой файла. -->
    <script src="js/vendor/p5.min.js"></script>
</head>
<body>
    <!-- =====================================================================
         K-02: КАССА ЗНАКОВ — восемнадцать гравюр
         =====================================================================
         Спрайт лежит в разметке, а не отдельным файлом: с P-02 у игры нет
         внешних запросов, и знак обязан быть на экране в первом же кадре.
         Контуры взяты из концепта «Альманах ночей» (раздел «Касса знаков»),
         а не нарисованы заново. Своего цвета у знака нет: `stroke: currentColor`
         в css/style.css — он берёт цвет строки, в которой стоит.
         Вставка — glyphSign(name) в js/ui.js, вручную <use> не пишем. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <!-- отмена -->
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M19 8.4H9.2C6.2 8.4 4.2 10.4 4.2 13.1 4.2 15.8 6.2 17.8 9.2 17.8H12.6"/><path d="M15.4 4.6 19.4 8.4 15.4 12.2"/></symbol>
        <!-- нож · разрез -->
        <symbol id="i-knife" viewBox="0 0 24 24"><path d="M3.6 20.4 11 13"/><path d="M11.4 12.6 20.4 3.6 21 8.4 13.2 16.2 Z"/><path d="M3.6 20.4 6.4 20.4"/></symbol>
        <!-- прижать -->
        <symbol id="i-press" viewBox="0 0 24 24"><path d="M8.4 12V6.4a1.5 1.5 0 0 1 3 0v4.2"/><path d="M11.4 10.6V5a1.5 1.5 0 0 1 3 0v5.6"/><path d="M14.4 10.6V6.6a1.5 1.5 0 0 1 3 0V13c0 4-2.4 6.4-6 6.4-2.8 0-4.3-1.2-5.6-3.6l-1.4-2.4a1.5 1.5 0 0 1 2.6-1.5l1.4 2.1"/></symbol>
        <!-- закладка -->
        <symbol id="i-ribbon" viewBox="0 0 24 24"><path d="M7 3.4h10v15.4l-5-3.4-5 3.4Z"/><path d="M7 8.6h10"/></symbol>
        <!-- поиск -->
        <symbol id="i-tel" viewBox="0 0 24 24"><path d="M3.4 9.8 13.6 3.6 16.4 8.2 6.2 14.4Z"/><path d="M14.8 5.6 17.6 4 19.2 6.6 16.4 8.2"/><path d="M9.5 13.2 6 21"/><path d="M11.5 13.9 14.6 21"/><path d="M10.6 15.7v-3.1"/></symbol>
        <!-- ночь -->
        <symbol id="i-crescent" viewBox="0 0 24 24"><path d="M14.5 3.2A9.2 9.2 0 1 0 14.5 20.8 7.1 7.1 0 1 1 14.5 3.2Z"/></symbol>
        <!-- ночь закрыта -->
        <symbol id="i-nightstar" viewBox="0 0 24 24"><path d="M12.5 4A8 8 0 1 0 12.5 20 6.2 6.2 0 1 1 12.5 4Z"/><path d="M17.5 6.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7Z"/></symbol>
        <!-- приход -->
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="M11 4c.6 4 1.8 5.2 5.8 5.8-4 .6-5.2 1.8-5.8 5.8-.6-4-1.8-5.2-5.8-5.8C9.2 9.2 10.4 8 11 4Z"/><path d="M17.6 14.4c.3 1.9.9 2.5 2.8 2.8-1.9.3-2.5.9-2.8 2.8-.3-1.9-.9-2.5-2.8-2.8 1.9-.3 2.5-.9 2.8-2.8Z"/></symbol>
        <!-- огранка -->
        <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 3 19.5 9.5 12 21 4.5 9.5Z"/><path d="M4.5 9.5H19.5"/><path d="M12 3 9.2 9.5 12 21"/><path d="M12 3 14.8 9.5 12 21"/></symbol>
        <!-- зодчий -->
        <symbol id="i-pillar" viewBox="0 0 24 24"><path d="M4 6.6 12 3l8 3.6"/><path d="M5 8.4H19"/><path d="M5 19.6H19"/><path d="M7.6 8.4v11.2M12 8.4v11.2M16.4 8.4v11.2"/><path d="M4 21.4H20"/></symbol>
        <!-- вызов -->
        <symbol id="i-comet" viewBox="0 0 24 24"><circle cx="8.6" cy="15.4" r="3.2"/><path d="M11.2 12.8 20 4"/><path d="M12.6 15.4 19 12.4"/><path d="M8.6 11.2 12.4 5.6"/></symbol>
        <!-- малое -->
        <symbol id="i-loz" viewBox="0 0 24 24"><path d="M12 4.5 18.5 12 12 19.5 5.5 12Z"/></symbol>
        <!-- соединять -->
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
        <!-- двигать -->
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M12 3.2v17.6M3.2 12h17.6"/><path d="M12 3.2 9.6 5.8M12 3.2l2.4 2.6M12 20.8l-2.4-2.6M12 20.8l2.4-2.6M3.2 12l2.6-2.4M3.2 12l2.6 2.4M20.8 12l-2.6-2.4M20.8 12l-2.6 2.4"/></symbol>
        <!-- переписать -->
        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20.2 8.4 19l10.4-10.4a2.2 2.2 0 0 0-3.1-3.1L5.3 15.9Z"/><path d="M14.6 6.9 17.1 9.4"/></symbol>
        <!-- экслибрис -->
        <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5.6 4.4h9.2l4.6 4.6v10.6H5.6Z"/><path d="M14.8 4.4V9h4.6"/></symbol>
        <!-- полная огранка -->
        <symbol id="i-corona" viewBox="0 0 26 16"><path d="M3 14A10.5 10.5 0 0 1 23 14"/><path d="M13 8.6V2"/><path d="M7.4 9.8 5.6 4.6"/><path d="M18.6 9.8 20.4 4.6"/></symbol>
        <!-- свод · итог -->
        <symbol id="i-arc" viewBox="0 0 24 24"><path d="M3.5 17.5a8.5 8.5 0 0 1 17 0"/><path d="M7 17.5a5 5 0 0 1 10 0"/></symbol>
      </defs>
    </svg>

    <div id="app">
        <!-- K-04: постоянного интерфейса на небе не осталось — отмена стала
             корректорской пометкой на канвасе. -->
        <button type="button" id="devToggleBtn" class="dev-toggle-btn" aria-label="Служебная панель"></button>
        <div id="devControls" class="dev-controls">
            <div class="dev-zoom-row">
                <button type="button" id="zoomOutButton" title="Отдалить">−</button>
                <button type="button" id="zoomInButton" title="Приблизить">＋</button>
            </div>
            <button id="resetButton">Сбросить небо</button>
            <div class="dev-picture-row">
                <select id="devPictureFieldSelect" aria-label="Поле-картинка"></select>
                <button id="devPictureFieldShowBtn" type="button">Показать</button>
            </div>
            <button id="devAddMetaButton">+100 ✦ (как забор награды)</button>
            <button id="devNewDayButton">Новый день</button>
            <button id="devResetAchievementsButton">Сбросить достижения</button>
            <button id="fullResetButton" class="btn-danger">Полный сброс</button>
        </div>

        <div id="canvas-container"></div>

        <!-- K-13: рамка гравюры поверх встроенного канваса — рисуется отдельным
             узлом (не псевдоэлементом дочернего слота книги), потому что канвас
             при встраивании поднимается над `.book` z-индексом; рамка обязана
             стоять ещё выше, вне стека книги. Позицию и размер держит
             updateExLibrisEmbedding() в sketch.js — те же числа, что у канваса. -->
        <div id="exLibrisFrameOverlay" aria-hidden="true"></div>

        <!-- K-05: лента-закладка вместо свёрнутой полосы U-09. Нижний правый
             угол — под большой палец правой руки; тап или потягивание вверх
             открывают книгу. Видимый хвост узкий, зона касания шире его. -->
        <div id="skyRibbon" class="ribbon" role="button" tabindex="0"
             data-i18n-aria="book.openRibbon">
            <span class="ribbon-tail" aria-hidden="true">
                <span id="ribbonWax" class="ribbon-wax" hidden></span>
            </span>
        </div>

        <!-- K-11: чертёж закладки-цели — верхний левый угол неба, подальше от
             руки. Единственный постоянный предмет неба помимо ленты; появляется
             только когда закладка выставлена (renderSkyBookmark, ui.js). -->
        <div id="skyBookmark" class="sky-bookmark" hidden aria-hidden="true">
            <canvas id="skyBookmarkCanvas" class="sky-bookmark-canvas" width="60" height="60"></canvas>
            <div id="skyBookmarkName" class="sky-bookmark-name"></div>
            <div class="sky-bookmark-label" data-i18n="sky.bookmarkLabel"></div>
        </div>

        <!-- K-06: книга — полноэкранная замена шторки U-09. Пять высечек
             сквозные (видны на каждой странице), навигация плоская — любой
             раздел из любого в одно касание. Шкала света у корешка держит
             lifetimeMetaEarned (B-02), а не тратящийся metaScore. -->
        <div id="book" class="book" hidden>
            <div id="bookGauge" class="book-gauge" aria-hidden="true"></div>
            <div id="bookPage" class="book-page">
                <div class="book-head">
                    <div id="bookEyebrow" class="book-eyebrow"></div>
                    <h2 id="bookTitle" class="book-title"></h2>
                    <div class="book-rule" aria-hidden="true"></div>
                </div>
                <div id="bookBody" class="book-body">
                    <div id="bookToday" class="book-section" hidden>
                        <div id="bookTodayList" class="achv-list"></div>
                        <div id="bookTodayNews" class="book-news-list"></div>
                        <button type="button" id="bookReturnBtn" class="book-return" data-i18n="book.returnToSky">— return to the sky —</button>
                    </div>
                    <div id="bookIndex" class="book-section book-index" hidden></div>
                    <div id="bookAtlasSection" class="book-section" hidden>
                        <div class="book-pager" id="atlasPager">
                            <button type="button" class="book-pager-btn" data-pager="atlas" data-dir="-1" aria-label="Previous chapter">‹</button>
                            <span class="book-pager-label" id="atlasPagerLabel"></span>
                            <button type="button" class="book-pager-btn" data-pager="atlas" data-dir="1" aria-label="Next chapter">›</button>
                        </div>
                        <div id="atlasList" class="atlas-grid"></div>
                    </div>
                    <div id="bookStampsSection" class="book-section" hidden>
                        <div class="book-pager" id="stampsPager">
                            <button type="button" class="book-pager-btn" data-pager="rewards" data-dir="-1" aria-label="Previous chapter">‹</button>
                            <span class="book-pager-label" id="stampsPagerLabel"></span>
                            <button type="button" class="book-pager-btn" data-pager="rewards" data-dir="1" aria-label="Next chapter">›</button>
                        </div>
                        <div id="achievementsList" class="achv-list"></div>
                    </div>
                    <div id="bookExLibris" class="book-section" hidden>
                        <!-- B-02: те же величины, что были в поповере шторки —
                             прогресс-бар свой, «за всё время», не ✦ из шапки. -->
                        <div id="exLibrisLocked" class="obs-lock-hint" hidden>
                            <div class="obs-lock-title"><svg class="ic ic-sm" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-tel"/></svg> <span id="exLibrisLockTitle"></span></div>
                            <div class="obs-lock-sub" id="exLibrisLockSub"></div>
                            <div class="obs-lock-bar"><div id="exLibrisLockBarFill" class="obs-lock-bar-fill"></div></div>
                            <div class="obs-lock-progress" id="exLibrisLockProgress"></div>
                        </div>

                        <!-- K-13: гравюра вклеена в лист — холст живёт внутри рамки,
                             а не во весь экран. #exLibrisCanvasSlot только резервирует
                             место в вёрстке страницы; сам канвас переносится сюда
                             поверх (updateExLibrisEmbedding, sketch.js) — координаты,
                             клампы и хит-тесты обсерватории не меняются вовсе, они
                             считают от фактического размера канваса. -->
                        <div id="exLibrisPlate" class="exlibris-plate" hidden>
                            <div id="exLibrisCanvasSlot" class="exlibris-canvas-slot"></div>
                            <div class="exlibris-caption">
                                <div class="exlibris-caption-el" data-i18n="observatory.exLibris">Ex libris</div>
                                <div class="exlibris-caption-flourish" aria-hidden="true">
                                    <span class="exlibris-caption-ln"></span>
                                    <svg class="ic ic-sm" width="11" height="11" focusable="false"><use href="#i-loz"/></svg>
                                    <span class="exlibris-caption-ln"></span>
                                </div>
                                <div class="exlibris-caption-sub" id="exLibrisCaptionSub"></div>
                            </div>
                            <!-- B-02: тумблер «соединять»/«двигать»; красить — тапом
                                 в режиме «двигать» (тот же жест, что и раньше). -->
                            <div id="observatoryModeSeg" class="obs-mode-toggle">
                                <button type="button" id="obsModeConnectBtn" class="seg-btn seg-btn-icon"
                                        data-i18n-title="observatory.modeConnect"
                                        data-i18n-aria="observatory.modeConnect"><svg class="ic ic-sm" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-link"/></svg></button>
                                <button type="button" id="obsModeMoveBtn" class="seg-btn seg-btn-icon"
                                        data-i18n-title="observatory.modeMove"
                                        data-i18n-aria="observatory.modeMove"><svg class="ic ic-sm" width="16" height="16" aria-hidden="true" focusable="false"><use href="#i-hand"/></svg></button>
                            </div>
                        </div>
                    </div>
                    <!-- K-14: настройки — вход только строкой из «Index», своей
                         высечки нет (решение K-06: высечек пять). Первый тумблер —
                         звук; список рассчитан на второй (вибро, A-05/U-14). -->
                    <div id="bookSettingsSection" class="book-section" hidden>
                        <div id="bookSettingsList" class="settings-list"></div>
                    </div>
                </div>
                <div class="book-foot">
                    <span data-i18n="book.brand">ALMANAC</span>
                    <span id="bookFolio"></span>
                </div>
            </div>
            <div id="bookTabs" class="book-tabs" role="tablist">
                <button type="button" class="book-tab" data-cut="today" role="tab" data-i18n="book.cutToday">Today</button>
                <button type="button" class="book-tab" data-cut="index" role="tab" data-i18n="book.cutIndex">Index</button>
                <button type="button" class="book-tab" data-cut="atlas" role="tab" data-i18n="book.cutAtlas">Atlas</button>
                <button type="button" class="book-tab" data-cut="stamps" role="tab">
                    <!-- applyHtmlI18n перезаписывает textContent целиком — капля
                         сургуча живёт своим span'ом, а не внутри локализуемого -->
                    <span data-i18n="book.cutStamps">Stamps</span><span id="bookTabStampsWax" class="book-tab-wax" hidden></span>
                </button>
                <button type="button" class="book-tab" data-cut="exlibris" role="tab" data-i18n="book.cutExLibris">Ex Libris</button>
            </div>
        </div>
    </div>

    <!-- L-01: i18n идёт самым первым — словари нужны уже на этапе объявления
         констант, а lang выставляется до первого кадра -->
    <script src="js/i18n.js"></script>
    <!-- T-01: харнесс идёт следом, чтобы ловить ошибки с самой загрузки;
         без ?test=1 он выходит сразу и ничего не создаёт -->
    <script src="js/testApi.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/pictureFields.js"></script>
    <script src="js/field.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/drawing.js"></script>
    <!-- B-02: обсерватория опирается на camera.js (клампы, зазоры) и field.js (maxEdge) -->
    <script src="js/observatory.js"></script>
    <script src="js/topologyRecognition.js"></script>
    <script src="js/recognition.js"></script>
    <script src="js/customTypes.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sketch.js"></script>
</body>
</html>
